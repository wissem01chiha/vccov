name: Request an improvement
about: Suggest a small improvement or enhancement for the project
labels: improvement

body:
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A short description of the improvement
      placeholder: A brief summary of the suggested improvement
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: Describe the improvement and why it would help
      placeholder: More details about the improvement
      required: false
  - type: textarea
    id: steps
    attributes:
      label: Suggested changes
      description: Any ideas for how to implement this improvement
      placeholder: Optional implementation notes
      required: false
