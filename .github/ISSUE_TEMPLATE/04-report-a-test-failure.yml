name: Report a failing test case
description: Use this template to report a failing unit test case 
title: "[Test Failure] "
labels:
  - bug
  - test
body:
  - type: markdown
    attributes:
      value: |
        Please provide the information below to help reproduce and troubleshoot the failing test.
  - type: input
    id: test-name
    attributes:
      label: Test name / test case
      description: Name or identifier of the failing test.
      placeholder: e.g. MyTestSuite.MyTestCase
  - type: input
    id: failure-summary
    attributes:
      label: Failure summary
      description: Briefly describe what failed and the expected behavior.
      placeholder: e.g. The test fails on assertion X with output Y.
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the failure.
      placeholder: |
        1. Checkout branch
        2. Configure with CMake
        3. Build and run tests
  - type: input
    id: cmake-version
    attributes:
      label: CMake version
      description: Exact CMake version used.
      placeholder: e.g. 3.27.1
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: OS version where the failure occurs.
      placeholder: e.g. Windows 11 22H2
  - type: input
    id: msvc-version
    attributes:
      label: MSVC version
      description: Microsoft Visual C++ version used for the build.
      placeholder: e.g. MSVC 19.35.32215
  - type: input
    id: compiler
    attributes:
      label: Compiler
      description: Compiler used for the build.
      placeholder: e.g. cl.exe, clang-cl
  - type: textarea
    id: build-options
    attributes:
      label: Build/project options
      description: CMake or project build options used.
      placeholder: |
        -DCMAKE_BUILD_TYPE=Release
        -DVCOV_ENABLE_TESTING=ON
  - type: textarea
    id: logs
    attributes:
      label: Test output / logs
      description: Include the relevant failing output or error logs.
      placeholder: |
        [  FAILED  ] 1 test, listed below:
        ...